<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atorasu – XML Schema Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <span class="brand">Atorasu</span>
  <button id="btn-open" title="Open one or more .xsd files">Open…</button>
  <button id="btn-folder" title="Open all .xsd files in a folder">Folder…</button>
  <button id="btn-sample" title="Load a sample schema">Sample</button>
  <select id="root-select" title="Root element" disabled></select>
  <label><input type="checkbox" id="chk-ann" checked> Annotations</label>
  <label><input type="checkbox" id="chk-type" checked> Type Info</label>
  <label><input type="checkbox" id="chk-attr" checked> Attributes</label>
  <input id="search" type="search" placeholder="Search name, type, doc or /xpath" autocomplete="off" spellcheck="false" disabled>
  <button id="btn-search" disabled>SEARCH</button>
  <button id="btn-reset" disabled>RESET</button>
  <span class="spacer"></span>
  <button id="btn-expand" title="Expand all (up to a safe limit)" disabled>Expand</button>
  <button id="btn-collapse" title="Collapse all" disabled>Collapse</button>
  <button id="btn-zoom-out" title="Zoom out">−</button>
  <span id="zoom-label">100%</span>
  <button id="btn-zoom-in" title="Zoom in">+</button>
</header>
<section id="results" hidden></section>
<main id="main">
  <div id="viewport" tabindex="0">
    <div id="stage"><svg id="lines" xmlns="http://www.w3.org/2000/svg"></svg><div id="nodes"></div></div>
    <div id="welcome">
      <h1>Atorasu</h1>
      <p>Drop one or more <b>.xsd</b> files here, or use <b>Open…</b> / <b>Folder…</b>.</p>
      <p>Schemas that include or import each other should be opened together.</p>
      <p><button id="btn-sample2">Load sample schema</button></p>
      <p class="muted">Everything runs locally. No network access is used.</p>
    </div>
  </div>
  <aside id="details"><div class="d-empty">Select a node to see its type, XPath and documentation.</div></aside>
</main>
<footer id="status">Ready</footer>
<input type="file" id="file-input" accept=".xsd,.xml,text/xml,application/xml" multiple hidden>
<input type="file" id="folder-input" webkitdirectory multiple hidden>
<div id="dropzone" hidden>Drop XSD files to open</div>
<script src="sample.js"></script>
<script src="xsd.js"></script>
<script src="view.js"></script>
<script src="app.js"></script>
</body>
</html>
